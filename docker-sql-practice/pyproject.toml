[project]
name = "docker-sql-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.6",
    "pgcli>=4.7.1",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy>=2.0.54",
    "tqdm>=4.70.1",
]

[project.scripts]
docker-sql-practice = "docker_sql_practice:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
